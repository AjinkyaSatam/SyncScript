services:
  - type: web
    name: syncscript
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: syncscript
          property: host
      - key: JDOODLE_CLIENT_ID
        sync: false
      - key: JDOODLE_CLIENT_SECRET
        sync: false

